<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 720" width="1680" height="720" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0e14"/>
      <stop offset="1" stop-color="#11131c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4fc3f7"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#818cf8"/>
    </marker>
  </defs>

  <rect width="1680" height="720" fill="url(#bg)"/>
  <rect width="1680" height="720" fill="url(#grid)"/>
  <rect width="1680" height="720" fill="url(#glow)"/>

  <text x="120" y="132" fill="#8b8f9c" font-size="22" letter-spacing="6">LANGGRAPH STATE MACHINE · 5 NODES</text>
  <text x="120" y="190" fill="#ece9e4" font-size="52" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="700" letter-spacing="-1">JD in. Tailored application out.</text>

  <!-- Input -->
  <g transform="translate(120 330)">
    <rect width="190" height="120" rx="14" fill="#151824" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="24" y="50" fill="#8b8f9c" font-size="17" letter-spacing="3">INPUT</text>
    <text x="24" y="86" fill="#ece9e4" font-size="22">JD text /</text>
    <text x="24" y="110" fill="#ece9e4" font-size="22">screenshot</text>
  </g>

  <!-- Wires -->
  <g stroke="url(#wire)" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M318 390H372"/>
    <path d="M592 390H646"/>
    <path d="M866 390H920"/>
    <path d="M1140 390H1194"/>
  </g>

  <!-- Nodes -->
  <g font-size="22">
    <g transform="translate(380 320)">
      <rect width="204" height="140" rx="14" fill="#171a29" stroke="#6366f1" stroke-opacity="0.7"/>
      <text x="22" y="40" fill="#818cf8" font-size="16" letter-spacing="3">01 EXTRACT</text>
      <text x="22" y="82" fill="#ece9e4">Gemini Flash</text>
      <text x="22" y="112" fill="#8b8f9c" font-size="18">&gt;95% field acc.</text>
    </g>
    <g transform="translate(654 320)">
      <rect width="204" height="140" rx="14" fill="#171a29" stroke="#6366f1" stroke-opacity="0.7"/>
      <text x="22" y="40" fill="#818cf8" font-size="16" letter-spacing="3">02 RETRIEVE</text>
      <text x="22" y="82" fill="#ece9e4">ChromaDB</text>
      <text x="22" y="112" fill="#8b8f9c" font-size="18">semantic profile</text>
    </g>
    <g transform="translate(928 320)">
      <rect width="204" height="140" rx="14" fill="#171a29" stroke="#6366f1" stroke-opacity="0.7"/>
      <text x="22" y="40" fill="#818cf8" font-size="16" letter-spacing="3">03 DEDUPE</text>
      <text x="22" y="82" fill="#ece9e4">Vector match</text>
      <text x="22" y="112" fill="#8b8f9c" font-size="18">skip repeats</text>
    </g>
    <g transform="translate(1202 320)">
      <rect width="204" height="140" rx="14" fill="#171a29" stroke="#6366f1" stroke-opacity="0.7"/>
      <text x="22" y="40" fill="#818cf8" font-size="16" letter-spacing="3">04 SYNTHESIZE</text>
      <text x="22" y="82" fill="#ece9e4">Personal email</text>
      <text x="22" y="112" fill="#8b8f9c" font-size="18">per role</text>
    </g>
  </g>

  <!-- HITL -->
  <g stroke="url(#wire)" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M1304 468V540H1430"/>
  </g>
  <g transform="translate(1438 500)">
    <rect width="150" height="84" rx="14" fill="#14201d" stroke="#22c55e" stroke-opacity="0.6"/>
    <text x="20" y="34" fill="#4ade80" font-size="16" letter-spacing="3">05 HITL</text>
    <text x="20" y="64" fill="#ece9e4" font-size="20">Approve</text>
  </g>

  <text x="120" y="640" fill="#8b8f9c" font-size="22">10 min → &lt;60 s per application</text>
</svg>
